<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>VANDERBOT PREMIUM</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .logo-img { width: 180px; margin-bottom: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; max-width: 360px; margin: 0 auto; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #8b949e; font-size: 0.9rem; }
        select, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: white; box-sizing: border-box; margin-bottom: 15px; font-size: 1rem; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 6px; border: none; background-color: #009d43; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 1.1rem; }
        button:disabled { opacity: 0.5; }
        .status-box { background: #0d1117; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; border: 1px dashed #30363d; }
        .win-text { color: #00ff6a; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/Jose2511-gift/vanderbot-backend/main/logo.png" class="logo-img">

    <div class="card">
        <label>ESTRATEGIA:</label>
        <select id="est">
            <option value="WANDER">EXTRA WANDER</option>
            <option value="ZEUS">ZEUS OTC</option>
            <option value="ETARE">ETARE</option>
        </select>

        <label>ID CORRETORA:</label>
        <input type="text" id="id_user" value="62846177">

        <button id="btn" onclick="buscarSinal()">ANALISAR MERCADO</button>

        <div class="status-box">
            <p>ATIVO: <span id="txt-ativo" class="win-text">AGUARDANDO...</span></p>
            <p>SINAL: <span id="txt-sinal" style="font-weight: bold;">--</span></p>
        </div>
    </div>

    <script>
        if('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        async function buscarSinal() {
            const btn = document.getElementById('btn');
            const ativo = document.getElementById('txt-ativo');
            const sinal = document.getElementById('txt-sinal');
            const est = document.getElementById('est').value;

            // Passo 1: Limpa a tela para você ver que está funcionando
            btn.innerText = "BUSCANDO...";
            btn.disabled = true;
            ativo.innerText = "LENDO MERCADO...";
            sinal.innerText = "---";

            try {
                // Passo 2: Busca no seu servidor do Render
                // Adicionei o timestamp (&t=...) para o celular não viciar no resultado antigo
                const url = `https://vanderbot-backend.onrender.com/analizar?estrategia=${est}&t=${new Date().getTime()}`;
                const res = await fetch(url);
                const data = await res.json();

                // Passo 3: Mostra o que o servidor mandou
                ativo.innerText = data.ativo; // <--- AQUI MUDA O NOME DA MOEDA
                sinal.innerText = data.sinal + " (" + data.assertividade + ")";
                
                if(data.sinal !== "AGUARDAR") {
                    sinal.style.color = "#00ff6a";
                } else {
                    sinal.style.color = "white";
                }

            } catch (e) {
                ativo.innerText = "ERRO DE CONEXÃO";
                sinal.innerText = "TENTE DE NOVO";
            } finally {
                btn.innerText = "ANALISAR MERCADO";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
