<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="manifest" href="manifest.json">
<script>
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANDERBOT PREMIUM</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .logo-img { width: 180px; margin-bottom: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; max-width: 360px; margin: 0 auto; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #8b949e; font-size: 0.9rem; }
        select, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: white; box-sizing: border-box; margin-bottom: 15px; font-size: 1rem; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 6px; border: none; background-color: #009d43; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 1.1rem; transition: 0.3s; }
        button:disabled { background-color: #1d3d2a; opacity: 0.6; }
        .status-box { background: #0d1117; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; border: 1px dashed #30363d; }
        .win-text { color: #00ff6a; font-weight: bold; font-size: 1.2rem; }
        .blink { animation: blinker 1.5s linear infinite; color: #00ff6a; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/Jose2511-gift/vanderbot-backend/main/logo.png" alt="VANDERBOT" class="logo-img">

    <div class="card">
        <label for="est">ESTRATÉGIA:</label>
        <select id="est">
            <option value="WANDER">EXTRA WANDER (TOP)</option>
            <option value="ZEUS">ZEUS OTC</option>
            <option value="ETARE">ETARE MODERADA</option>
        </select>

        <label for="id_user">ID CORRETORA:</label>
        <input type="text" id="id_user" value="62846577">

        <button id="btn" onclick="buscarSinal()">ANALISAR MERCADO</button>

        <div class="status-box">
            <p style="font-size: 0.7rem; margin-bottom: 10px;"><span class="blink">●</span> SISTEMA ATIVO</p>
            <p>ATIVO: <span id="txt-ativo" class="win-text">AGUARDANDO...</span></p>
            <p>SINAL: <span id="txt-sinal" style="font-weight: bold;">--</span></p>
        </div>
    </div>

    <script>
        async function buscarSinal() {
            const btn = document.getElementById('btn');
            const ativo = document.getElementById('txt-ativo');
            const sinal = document.getElementById('txt-sinal');
            const est = document.getElementById('est').value;

            btn.innerText = "VARRENDO ATIVOS...";
            btn.disabled = true;
            ativo.innerText = "PROCURANDO...";
            sinal.innerText = "--";

            try {
                // O segredo do 'cb=' é evitar o cache do navegador
                const url = `https://vanderbot-backend.onrender.com/analizar?estrategia=${est}&cb=${Date.now()}`;
                const res = await fetch(url);
                const data = await res.json();

                // AQUI ELE ATUALIZA O NOME DA MOEDA QUE VEM DO SERVIDOR
                ativo.innerText = data.ativo;
                sinal.innerText = data.sinal + " (" + data.assertividade + ")";
                
                if(data.sinal !== "AGUARDAR") {
                    sinal.style.color = "#00ff6a";
                }

            } catch (e) {
                ativo.innerText = "ERRO DE CONEXÃO";
                sinal.innerText = "TENTE DE NOVO";
            } finally {
                btn.innerText = "ANALISAR MERCADO";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
