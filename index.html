<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANDERBOT PREMIUM IA</title>
    <style>
        body { background-color: #0b0e11; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e2329; border-radius: 15px; padding: 20px; border: 1px solid #f0b90b; box-shadow: 0 4px 15px rgba(240, 185, 11, 0.2); }
        .btn { background: #f0b90b; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; }
        .status { font-size: 24px; margin: 15px 0; font-weight: bold; }
        .alerta { color: #f0b90b; font-size: 16px; margin-top: 10px; padding: 10px; border-radius: 5px; background: rgba(240, 185, 11, 0.1); }
        .cronometro { color: #848e9c; font-size: 14px; margin-top: 5px; }
        .buy { color: #0ecb81; }
        .sell { color: #f6465d; }
    </style>
</head>
<body>
    <div class="card">
        <h1>VANDERBOT <span style="color:#f0b90b">PREMIUM</span></h1>
        
        <div id="resultado">
            <p>Selecione a estratégia e clique em Analisar</p>
        </div>

        <button class="btn" onclick="analisar()">ANALISAR MERCADO</button>
        
        <div id="cronometro_display" class="cronometro">Sincronizando relógio...</div>
    </div>

    <script>
        function analisar() {
            const btn = document.querySelector('.btn');
            btn.innerText = "IA ANALISANDO...";
            
            fetch('/analisar?estrategia=ZEUS') // Ajuste aqui conforme sua rota
                .then(response => response.json())
                .then(data => {
                    const corClasse = data.sinal.includes("COMPRA") ? "buy" : "sell";
                    document.getElementById('resultado').innerHTML = `
                        <div class="status ${corClasse}">${data.ativo}</div>
                        <div class="status ${corClasse}">${data.sinal}</div>
                        <div style="font-size: 20px;">Assertividade: ${data.assertividade}</div>
                        <div class="alerta">${data.alerta}</div>
                    `;
                    document.getElementById('cronometro_display').innerText = data.cronometro;
                    btn.innerText = "ANALISAR MERCADO";
                });
        }

        // Cronômetro visual simples no navegador
        setInterval(() => {
            const agora = new Date();
            const seg = agora.getSeconds();
            const falta = 58 - seg > 0 ? 58 - seg : 60 - (seg - 58);
            if (seg >= 55 && seg <= 59) {
                document.getElementById('cronometro_display').innerHTML = "<b style='color:#0ecb81'>🚀 HORA DA VIRADA! ANALISE AGORA!</b>";
            } else {
                document.getElementById('cronometro_display').innerText = "⏳ Próxima virada em: " + (seg > 58 ? 58 + (60 - seg) : 58 - seg) + "s";
            }
        }, 1000);
    </script>
</body>
</html>
