<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>VANDERBOT PRIVATE</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .logo-img { width: 180px; margin-bottom: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; max-width: 360px; margin: 0 auto; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #8b949e; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        
        select, .input-fake { 
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; 
            background-color: #0d1117; color: white; box-sizing: border-box; 
            margin-bottom: 15px; font-size: 1rem; outline: none; appearance: none;
        }

        button { 
            width: 100%; padding: 15px; border-radius: 6px; border: none; 
            background-color: #009d43; color: white; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; font-size: 1.1rem; 
        }
        
        button:disabled { opacity: 0.5; }

        .status-box { 
            background: #0d1117; padding: 15px; border-radius: 8px; 
            text-align: center; margin-top: 15px; border: 1px dashed #30363d; 
        }

        .ativo-txt { color: #00ff6a; font-weight: bold; font-size: 1.6rem; display: block; margin-bottom: 5px; }
        .sinal-txt { font-weight: bold; font-size: 1.1rem; }
        
        /* Novos Estilos */
        .alerta-txt { color: #f0b90b; font-size: 0.9rem; margin-top: 10px; font-weight: bold; display: block; }
        .tendencia-txt { font-size: 0.8rem; color: #8b949e; text-transform: uppercase; margin-top: 5px; }
        .cronometro-box { margin-top: 15px; font-size: 0.85rem; color: #848e9c; border-top: 1px solid #30363d; padding-top: 10px; }
    </style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/Jose2511-gift/vanderbot-backend/main/logo.png" class="logo-img">

    <div class="card">
        <label>ESTRATEGIA:</label>
        <select id="est">
            <option value="WANDER">EXTRA WANDER</option>
            <option value="ZEUS">ZEUS OTC</option>
            <option value="ETARE">ETARE</option>
        </select>

        <label>MINHA CORRETORA:</label>
        <select id="id_user">
            <option value="174555933">POLARIUM</option>
            <option value="171825029">STOCKITY</option>
            <option value="62846177">QUOTEX</option>
            <option value="97181892">IQ OPTION</option>
        </select>

        <button id="btn" onclick="buscarSinal()">ANALISAR MERCADO</button>

        <div class="status-box">
            <p style="margin:0; font-size: 0.8rem; color: #8b949e;">ATIVO:</p>
            <span id="txt-ativo" class="ativo-txt">AGUARDANDO...</span>
            
            <p style="margin:10px 0 0 0; font-size: 0.8rem; color: #8b949e;">SINAL:</p>
            <span id="txt-sinal" class="sinal-txt">--</span>

            <span id="txt-alerta" class="alerta-txt"></span>
            <div id="txt-tendencia" class="tendencia-txt"></div>
        </div>

        <div id="cronometro_display" class="cronometro-box">⏳ Sincronizando virada de vela...</div>
    </div>

    <script>
        if('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        async function buscarSinal() {
            const btn = document.getElementById('btn');
            const ativo = document.getElementById('txt-ativo');
            const sinal = document.getElementById('txt-sinal');
            const alerta = document.getElementById('txt-alerta');
            const tendencia = document.getElementById('txt-tendencia');
            const est = document.getElementById('est').value;
            const id_user = document.getElementById('id_user').value;

            btn.innerText = "ANALISANDO...";
            btn.disabled = true;

            try {
                const url = `https://vanderbot-backend.onrender.com/analizar?estrategia=${est}&id_user=${id_user}&t=${new Date().getTime()}`;
                const res = await fetch(url);
                const data = await res.json();

                let parLimpo = data.ativo.split('] ').pop();
                
                ativo.innerText = parLimpo;
                sinal.innerText = data.sinal + " (" + data.assertividade + ")";
                
                // Preenche Alerta e Tendência vindo do Python
                alerta.innerText = data.alerta;
                tendencia.innerText = "Tendência: " + data.tendencia;
                
                if(data.sinal.includes("COMPRA")) {
                    sinal.style.color = "#00ff6a";
                } else if(data.sinal.includes("VENDA")) {
                    sinal.style.color = "#ff4b4b";
                }

            } catch (e) {
                ativo.innerText = "ERRO!";
                sinal.innerText = "TENTE NOVAMENTE";
            } finally {
                btn.innerText = "ANALISAR MERCADO";
                btn.disabled = false;
            }
        }

        // Cronômetro em Tempo Real para a Regra dos 2 Segundos
        setInterval(() => {
            const agora = new Date();
            const seg = agora.getSeconds();
            const prox = 58 - seg > 0 ? 58 - seg : (58 + (60 - seg));
            
            const display = document.getElementById('cronometro_display');
            if (seg >= 55 && seg <= 59) {
                display.innerHTML = "<b style='color:#00ff6a'>🚀 HORA DO CLIQUE! (VIRADA)</b>";
            } else {
                display.innerText = "⏳ Virada de vela em: " + (seg > 58 ? 58 + (60 - seg) : 58 - seg) + "s";
            }
        }, 1000);
    </script>
</body>
</html>
